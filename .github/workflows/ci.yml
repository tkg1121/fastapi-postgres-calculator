name: Test, scan, and deploy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, PostgreSQL, and browser tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: fastapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastapi_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:test-password@127.0.0.1:5432/fastapi_test
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: test-password
      PGDATABASE: fastapi_test
      REQUIRE_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Apply and check migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Unit tests
        run: python -m pytest tests/unit -v
      - name: API and real PostgreSQL integration tests
        run: python -m pytest tests/integration -v
      - name: Playwright end-to-end tests
        run: python -m pytest tests/e2e -v --browser chromium

  compose:
    name: Compose and SQL regression checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare local environment
        run: cp .env.example .env
      - name: Build and start services
        run: docker compose up -d --build --wait
      - name: Run SQL exercises and relationship checks
        run: |
          for script in sql/0*.sql sql/10_final_state.sql sql/11_verify_relationships.sql; do
            docker compose exec -T db psql -U postgres -d fastapi_db -v ON_ERROR_STOP=1 -f "/scripts/$(basename "$script")"
          done
      - name: Verify application and secure users
        run: python3 scripts/verify_deployment.py
      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down

  image:
    name: Build, scan, and publish Docker image
    needs: [test, compose]
    runs-on: ubuntu-24.04
    env:
      IMAGE: tkg1121/fastapi-postgres-calculator
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: image-test-password
          POSTGRES_DB: image_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d image_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln
          exit-code: "1"
      - name: Preserve security scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-security-scan
          path: trivy-report.txt
      - name: Run the scanned image
        run: |
          docker run -d --name calculator-image --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=postgres \
            -e PGPASSWORD=image-test-password -e PGDATABASE=image_test \
            "$IMAGE:sha-$GITHUB_SHA"
          python3 scripts/verify_deployment.py
          docker rm -f calculator-image
      - name: Sign in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested and scanned image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
      - name: Pull the published image and verify it runs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker image rm "$IMAGE:latest" "$IMAGE:sha-$GITHUB_SHA"
          docker pull "$IMAGE:sha-$GITHUB_SHA"
          DIGEST=$(docker image inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          docker run -d --name calculator-published --network host \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=postgres \
            -e PGPASSWORD=image-test-password -e PGDATABASE=image_test "$DIGEST"
          python3 scripts/verify_deployment.py
          echo "Published and verified: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs and cleanup
        if: always()
        run: |
          for container in calculator-image calculator-published; do
            if docker inspect "$container" >/dev/null 2>&1; then
              docker logs "$container"
              docker rm -f "$container"
            fi
          done
